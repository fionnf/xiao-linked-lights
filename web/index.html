<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linked Lamps</title>
<style>
  :root {
    --bg:#0d0f14; --panel:#161a22; --edge:#242b38; --ink:#e8ecf4;
    --dim:#8b95a8; --accent:#ffb347; --ok:#4ade80; --bad:#f87171;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,
    BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding:24px;
  }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .lamps { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
  .lamp {
    background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:16px;
  }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .name { font-weight:600; }
  .node { color:var(--dim); font-size:12px; font-family:ui-monospace,monospace; }
  button {
    background:#212836; color:var(--ink); border:1px solid var(--edge); border-radius:8px;
    padding:8px 12px; font-size:14px; cursor:pointer; font-family:inherit;
  }
  button:hover:not(:disabled) { background:#2a3242; border-color:#3a4456; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:600; }
  button.primary:hover:not(:disabled) { background:#ffc266; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .ctl { margin-bottom:10px; }
  .ctl label { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .ctl label b { color:var(--ink); font-family:ui-monospace,monospace; font-weight:500; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .strip { display:flex; gap:1px; height:26px; margin:12px 0; border-radius:5px; overflow:hidden; }
  .strip i { flex:1; background:#000; transition:background .25s; }
  .log {
    background:#0a0c10; border:1px solid var(--edge); border-radius:8px; padding:10px;
    font:12px/1.5 ui-monospace,monospace; height:150px; overflow:auto;
    white-space:pre-wrap; color:#9fb0c8;
  }
  .log .rx { color:var(--ok); }
  .log .tx { color:var(--accent); }
  .note {
    margin-top:18px; padding:12px 14px; background:#161a22; border:1px solid var(--edge);
    border-left:3px solid var(--accent); border-radius:6px; font-size:13px; color:var(--dim);
  }
  .note b { color:var(--ink); }
  .unsupported { background:#2a1616; border-left-color:var(--bad); }
</style>
</head>
<body>

<h1>Linked Lamps</h1>
<div class="sub">Two lamps, one colour. Tap either and both change &mdash; 868&nbsp;MHz LoRa, ~211&nbsp;ms.</div>

<div class="lamps" id="lamps"></div>

<div class="note" id="note">
  <b>Before connecting:</b> close any serial monitor holding the port, or the browser
  cannot open it. Each lamp is a separate connection &mdash; hit Connect on both panels
  and pick a different port each time.
</div>

<script>
// ---------------------------------------------------------------------------
// Web Serial control for the lamp firmware.
//
// The firmware already exposes a plain line-based command interface over USB
// (tap, power, groups N, bright F ...), which is what the serial console uses.
// This page speaks exactly the same protocol, so nothing had to change on the
// device - the browser is just another terminal, with buttons instead of typing.
//
// Chrome/Edge/Arc only: Safari and Firefox do not implement Web Serial.
// ---------------------------------------------------------------------------

const NUM_LEDS = 39;

class Lamp {
  constructor(label, hint) {
    this.label = label; this.hint = hint;
    this.port = null; this.writer = null; this.connected = false;
    this.buf = '';
    this.build();
  }

  build() {
    const el = document.createElement('div');
    el.className = 'lamp';
    el.innerHTML = `
      <div class="head">
        <span class="dot"></span>
        <span class="name">${this.label}</span>
        <span class="node"></span>
        <span style="flex:1"></span>
        <button class="connect">Connect</button>
      </div>
      <div class="strip"></div>
      <div class="row">
        <button class="primary act" data-cmd="tap" disabled>Tap</button>
        <button class="act" data-cmd="power" disabled>Power</button>
        <button class="act" data-cmd="chain" disabled>Chain</button>
        <button class="act" data-cmd="test" disabled>Test</button>
        <button class="act" data-cmd="sync" disabled>Sync</button>
        <button class="act" data-cmd="status" disabled>Status</button>
      </div>
      <div class="ctl"><label>Brightness <b class="v-bright">0.60</b></label>
        <input type="range" class="s-bright" min="0" max="1" step="0.05" value="0.6" disabled></div>
      <div class="ctl"><label>Colour position <b class="v-pos">&mdash;</b></label>
        <input type="range" class="s-pos" min="0" max="1" step="0.01" value="0.5" disabled></div>
      <div class="ctl"><label>Bands <b class="v-groups">random</b></label>
        <input type="range" class="s-groups" min="0" max="4" step="1" value="0" disabled></div>
      <div class="ctl"><label>Fade frames <b class="v-fade">60</b></label>
        <input type="range" class="s-fade" min="1" max="200" step="1" value="60" disabled></div>
      <div class="ctl"><label>Breathe <b class="v-breathe">0.10</b></label>
        <input type="range" class="s-breathe" min="0" max="0.5" step="0.01" value="0.1" disabled></div>
      <div class="ctl"><label>Auto-drift seconds <b class="v-drift">65</b></label>
        <input type="range" class="s-drift" min="0" max="300" step="5" value="65" disabled></div>
      <div class="log"></div>`;
    document.getElementById('lamps').appendChild(el);
    this.el = el;
    this.logEl = el.querySelector('.log');
    this.stripEl = el.querySelector('.strip');
    for (let i = 0; i < NUM_LEDS; i++) this.stripEl.appendChild(document.createElement('i'));

    el.querySelector('.connect').onclick = () => this.toggle();
    el.querySelectorAll('.act').forEach(b => b.onclick = () => this.send(b.dataset.cmd));

    const slide = (cls, cmd, fmt, live) => {
      const s = el.querySelector('.s-' + cls), v = el.querySelector('.v-' + cls);
      const apply = () => {
        v.textContent = fmt(s.value);
        this.send(cmd + ' ' + s.value);
      };
      // Fire on release, not on every pixel of drag: each change is a serial
      // command, and a dragged slider would otherwise flood the link.
      s.onchange = apply;
      s.oninput = () => { v.textContent = fmt(s.value); if (live) apply(); };
    };
    slide('bright', 'bright', v => (+v).toFixed(2));
    slide('pos', 'pos', v => (+v).toFixed(2));
    slide('groups', 'groups', v => v === '0' ? 'random' : v);
    slide('fade', 'fade', v => v);
    slide('breathe', 'breathe', v => (+v).toFixed(2));
    slide('drift', 'drift', v => v === '0' ? 'off' : v + ' s');
  }

  setEnabled(on) {
    this.connected = on;
    this.el.querySelector('.dot').classList.toggle('on', on);
    this.el.querySelectorAll('button.act, input[type=range]').forEach(b => b.disabled = !on);
    this.el.querySelector('.connect').textContent = on ? 'Disconnect' : 'Connect';
  }

  log(text, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text + '\n';
    this.logEl.appendChild(span);
    this.logEl.scrollTop = this.logEl.scrollHeight;
    while (this.logEl.childNodes.length > 300) this.logEl.removeChild(this.logEl.firstChild);
  }

  async toggle() {
    if (this.connected) return this.disconnect();
    try {
      this.port = await navigator.serial.requestPort();
      await this.port.open({ baudRate: 115200 });
      this.writer = this.port.writable.getWriter();
      this.setEnabled(true);
      this.log('connected', 'rx');
      this.read();
      setTimeout(() => this.send('status'), 400);
    } catch (e) {
      this.log('connect failed: ' + e.message);
    }
  }

  async disconnect() {
    try {
      this.reading = false;
      if (this.writer) { this.writer.releaseLock(); this.writer = null; }
      if (this.reader) { await this.reader.cancel().catch(()=>{}); }
      if (this.port) await this.port.close();
    } catch (e) { /* the port may already be gone */ }
    this.setEnabled(false);
    this.log('disconnected');
  }

  async read() {
    this.reading = true;
    while (this.port && this.port.readable && this.reading) {
      this.reader = this.port.readable.getReader();
      try {
        while (true) {
          const { value, done } = await this.reader.read();
          if (done) break;
          this.buf += new TextDecoder().decode(value);
          let i;
          while ((i = this.buf.indexOf('\n')) >= 0) {
            const line = this.buf.slice(0, i).replace(/\r$/, '');
            this.buf = this.buf.slice(i + 1);
            if (line.trim()) this.handle(line);
          }
        }
      } catch (e) {
        this.log('read error: ' + e.message);
      } finally {
        this.reader.releaseLock();
      }
    }
  }

  handle(line) {
    this.log(line, line.startsWith('[rx]') ? 'rx' : null);
    const node = line.match(/node=([0-9a-f]+)/);
    if (node) this.el.querySelector('.node').textContent = '!' + node[1];
    // Mirror the strip in the browser so the lamp without LEDs is still visible.
    const pos = line.match(/\[pos\] ([\d.]+) -> rgbw\((\d+),(\d+),(\d+),(\d+)\)/);
    if (pos) this.paintAll(+pos[2], +pos[3], +pos[4], +pos[5]);
    const seed = line.match(/seed=(\d+)/);
    if (seed) this.paintScene(+seed[1]);
  }

  // A rough preview of what the strip is showing, derived from the same seed the
  // firmware used. Deliberately approximate - it is a sanity check that both
  // lamps agree, not a colour-accurate render.
  paintScene(seed) {
    let s = seed >>> 0 || 1;
    const next = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s; };
    const unit = () => (next() >>> 8) / 16777216;
    const bands = 2 + Math.floor(unit() * 2);
    const sizes = [];
    let left = NUM_LEDS;
    for (let i = 0; i < bands; i++) {
      const size = (i === bands - 1) ? left : Math.max(8, Math.floor(left / (bands - i)));
      sizes.push(size); left -= size;
    }
    const cells = this.stripEl.children;
    let idx = 0;
    for (const size of sizes) {
      const p = unit();
      const hue = (1 - p) * 40 + p * 300;
      const col = `hsl(${hue}, ${20 + p * 70}%, ${55 - p * 10}%)`;
      for (let k = 0; k < size && idx < NUM_LEDS; k++, idx++) cells[idx].style.background = col;
    }
  }

  paintAll(r, g, b, w) {
    const col = `rgb(${Math.min(255, r + w)},${Math.min(255, g + w)},${Math.min(255, b + w)})`;
    for (const c of this.stripEl.children) c.style.background = col;
  }

  async send(cmd) {
    if (!this.writer) return;
    this.log('> ' + cmd, 'tx');
    await this.writer.write(new TextEncoder().encode(cmd + '\n'));
  }
}

if (!('serial' in navigator)) {
  const n = document.getElementById('note');
  n.className = 'note unsupported';
  n.innerHTML = '<b>This browser has no Web Serial support.</b> Use Chrome, Edge or Arc. ' +
                'Safari and Firefox do not implement the API.';
}

new Lamp('Lamp A', 'has the LED strip');
new Lamp('Lamp B', 'second lamp');
</script>
</body>
</html>
