name: Deploy web app to Pages

# Publishes web/ (the Bluetooth + Web Serial control panels) as a static site.
# Web Bluetooth requires a secure context, so this exists to give the BLE app
# an https:// URL to test from any device, not just localhost.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'
      - id: deployment
        uses: actions/deploy-pages@v4
