[env:xiao-lamp]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = XIAO S3 Lamp (header-wired SX1262)
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3
board_level = pr
board_check = false
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32s3_base.build_flags}
  -D XIAO_LAMP
  -I variants/esp32s3/xiao_lamp
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0

; The lamp module drives an SK6812 RGBW strip, which Meshtastic itself has no
; reason to depend on.
lib_deps =
  ${esp32s3_base.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.3
